<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Shipment route with three checkpoints">
  <rect width="320" height="180" rx="4" fill="#06121F"/>
  <line x1="40" y1="110" x2="280" y2="110" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <line x1="40" y1="110" x2="200" y2="110" stroke="#4FD1C4" stroke-width="3"/>
